# Netlify build & deploy configuration.
# Pages are emitted as `about.html` etc. (see astro.config.mjs); Netlify's
# Pretty URLs serve them at `/about`, matching the live Squarespace URLs.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---- Redirects ---------------------------------------------------------------
# Legacy Squarespace URL for the homepage.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# Squarespace served the blog feed at /blog?format=rss; keep existing subscribers.
# `force` is needed because /blog itself is a real page.
[[redirects]]
  from = "/blog"
  to = "/blog/rss.xml"
  status = 301
  force = true
  query = { format = "rss" }

# ---- Headers -----------------------------------------------------------------
# Fingerprinted build assets (CSS, JS, optimized images) never change.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
