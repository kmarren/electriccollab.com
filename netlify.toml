# Netlify build & deploy configuration.
# Pages are emitted as `about.html` etc. (see astro.config.mjs); Netlify's
# Pretty URLs serve them at `/about`, matching the live Squarespace URLs.
# Response headers and simple redirects live in public/_headers and
# public/_redirects, shared with Cloudflare (see wrangler.jsonc).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---- Redirects ---------------------------------------------------------------
# Squarespace served the blog feed at /blog?format=rss; keep existing subscribers.
# `force` is needed because /blog itself is a real page. (Cloudflare can't
# match query strings in _redirects; worker/index.ts handles it there.)
[[redirects]]
  from = "/blog"
  to = "/blog/rss.xml"
  status = 301
  force = true
  query = { format = "rss" }
